version: "3.8"

services:
  ms-event-manager:
    build:
      context: ./ms-event-manager
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - ms-ticket-manager

  ms-ticket-manager:
    build:
      context: ./ms-ticket-manager
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
